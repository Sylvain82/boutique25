security:
    # Les mots de passe sont « hachés » (transformés de façon irréversible) avant d'être stockés.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Les comptes sont lus dans la table « utilisateur », par leur email.
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_connexion
                check_path: app_connexion
                enable_csrf: true
                default_target_path: app_admin
            logout:
                path: app_deconnexion
                target: app_home
            # Limite les essais de mot de passe (5 par minute) pour freiner les attaques.
            login_throttling:
                max_attempts: 5

    # Seuls les administrateurs accèdent à /admin.
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
